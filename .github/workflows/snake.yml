# Place this file at: .github/workflows/snake.yml (in your ashok-varghese/ashok-varghese repo)
# This bot regenerates an SVG of a snake "eating" your contribution graph, daily.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 3:00 AM UTC
  workflow_dispatch: {}    # allows manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ashok-varghese
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
